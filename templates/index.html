<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management System</title>
    <style>
        :root {
            --bg-primary: #0b1120;
            --bg-secondary: #151e32;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --glass-bg: rgba(21, 30, 50, 0.75);
            --glass-border: rgba(56, 189, 248, 0.25);
            --card-radius: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 20% 30%, #1e293b 0%, var(--bg-primary) 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            padding: 2rem;
        }

        /* Live Inventory Background Layer */
        .inventory-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Floating Inventory Crates */
        .crate {
            position: absolute;
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(14, 165, 233, 0.04));
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 6px;
            animation: drift 22s infinite linear;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .crate::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px dashed rgba(56, 189, 248, 0.5);
            border-radius: 4px;
        }

        .crate::after {
            content: '';
            position: absolute;
            bottom: 6px; left: 10px;
            width: 34px; height: 4px;
            background: repeating-linear-gradient(90deg, rgba(56, 189, 248, 0.6) 0px, rgba(56, 189, 248, 0.6) 2px, transparent 2px, transparent 4px);
        }

        .crate:nth-child(1) { top: 15%; left: 12%; animation-duration: 24s; transform: rotate(12deg); }
        .crate:nth-child(2) { top: 65%; left: 82%; animation-duration: 28s; animation-delay: -4s; transform: rotate(-18deg); }
        .crate:nth-child(3) { top: 35%; left: 28%; animation-duration: 20s; animation-delay: -9s; transform: rotate(35deg); }
        .crate:nth-child(4) { top: 78%; left: 45%; animation-duration: 26s; animation-delay: -2s; transform: rotate(-8deg); }
        .crate:nth-child(5) { top: 22%; left: 72%; animation-duration: 23s; animation-delay: -11s; transform: rotate(22deg); }

        @keyframes drift {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.5; }
            50% { transform: translateY(-50px) rotate(180deg) scale(1.08); opacity: 0.8; }
            100% { transform: translateY(0) rotate(360deg) scale(1); opacity: 0.5; }
        }

        /* Scanning Beam */
        .scan-beam {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
            top: 0;
            animation: scan 5s linear infinite;
            box-shadow: 0 0 25px var(--accent-glow);
            opacity: 0.7;
        }

        @keyframes scan {
            0% { top: -5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 105%; opacity: 0; }
        }

        /* Drifting Inventory Tags */
        .tag {
            position: absolute;
            padding: 4px 10px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--accent);
            font-family: monospace;
            letter-spacing: 0.5px;
            animation: floatTag 14s infinite ease-in-out;
            opacity: 0;
        }

        @keyframes floatTag {
            0% { transform: translateY(20px) translateX(-20px); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-60px) translateX(30px); opacity: 0; }
        }

        /* Main Card */
        .dashboard {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 3rem;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .dashboard:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
        }

        header h1 {
            font-size: 2.4rem;
            margin-bottom: 0.6rem;
            background: linear-gradient(135deg, #f8fafc, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        header p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        section h2 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.6rem;
            font-weight: 600;
        }

        ul {
            list-style: none;
            margin-bottom: 2rem;
        }

        li {
            margin-bottom: 0.8rem;
        }

        a {
            color: var(--text-primary);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid transparent;
            width: 100%;
            text-align: left;
        }

        a:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            transform: translateX(6px);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .admin-section {
            margin-top: 2.5rem;
            text-align: center;
            border-top: 1px solid var(--glass-border);
            padding-top: 1.5rem;
        }

        .btn-admin {
            display: inline-block;
            padding: 0.85rem 2.2rem;
            background: linear-gradient(135deg, var(--accent), #0284c7);
            color: #0f172a;
            font-weight: 600;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 18px rgba(56, 189, 248, 0.35);
            border: none;
            width: auto;
        }

        .btn-admin:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.5);
            background: linear-gradient(135deg, #0ea5e9, #0369a1);
        }

        @media (max-width: 650px) {
            .dashboard { padding: 2rem 1.5rem; }
            header h1 { font-size: 2rem; }
            section h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="inventory-bg" id="inventory-bg">
        <div class="crate"></div>
        <div class="crate"></div>
        <div class="crate"></div>
        <div class="crate"></div>
        <div class="crate"></div>
        <div class="scan-beam"></div>
    </div>

    <main class="dashboard">
        <header>
            <h1>Inventory Management System</h1>
            <p>Welcome to your backend server.</p>
        </header>

        <section class="docs">
            <h2>API Documentation</h2>
            <ul>
                <li><a href="/swagger/">Swagger Docs</a></li>
                <li><a href="/redoc/">ReDoc</a></li>
            </ul>
        </section>

        <section class="apis">
            <h2>Available APIs</h2>
            <ul>
                <li><a href="/api/inventory/devices/">Devices API</a></li>
                <li><a href="/api/inventory/assignments/">Assignments API</a></li>
                <li><a href="/api/inventory/tickets/">Tickets API</a></li>
                <li><a href="/api/auth/login/">Login API</a></li>
            </ul>
        </section>

        <footer class="admin-section">
            <a href="/admin/" class="btn-admin">Go to Admin Panel</a>
        </footer>
    </main>

    <script>
        // Lightweight JS to spawn drifting inventory tags dynamically
        (function() {
            const bg = document.getElementById('inventory-bg');
            const prefixes = ['INV-', 'DEV-', 'ASN-', 'TKT-'];
            
            function createTag() {
                const tag = document.createElement('div');
                tag.className = 'tag';
                const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                const id = Math.floor(1000 + Math.random() * 9000);
                tag.textContent = `${prefix}${id}`;
                
                // Random position
                tag.style.left = `${Math.random() * 90}%`;
                tag.style.top = `${Math.random() * 80}%`;
                tag.style.animationDuration = `${10 + Math.random() * 12}s`;
                tag.style.animationDelay = `${Math.random() * 5}s`;
                
                bg.appendChild(tag);
                
                // Cleanup after animation
                setTimeout(() => {
                    if (tag.parentNode) tag.parentNode.removeChild(tag);
                }, 25000);
            }

            // Initial tags
            for(let i = 0; i < 6; i++) createTag();
            // Continuous spawn
            setInterval(createTag, 3500);
        })();
    </script>

</body>
</html>
